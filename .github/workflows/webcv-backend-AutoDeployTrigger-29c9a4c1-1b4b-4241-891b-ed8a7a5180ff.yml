name: Trigger auto deployment for webcv-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/webcv-backend-AutoDeployTrigger-29c9a4c1-1b4b-4241-891b-ed8a7a5180ff.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.WEBCVBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.WEBCVBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.WEBCVBACKEND_AZURE_SUBSCRIPTION_ID }}
          allow-no-subscriptions: true

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: ghcr.io
          registryUsername: ${{ secrets.WEBCVBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.WEBCVBACKEND_REGISTRY_PASSWORD }}
          containerAppName: webcv-backend
          resourceGroup: webcv-ai
          imageToBuild: ghcr.io/webcv-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


